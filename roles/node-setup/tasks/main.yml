---
# ---- OS Hardening ----
- name: Disable swap (required for kubelet)
  command: swapoff -a
  changed_when: false

- name: Remove swap entry from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s+'
    state: absent

- name: Load required kernel modules for Kubernetes networking
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Set required sysctl params for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }

- name: Disable unattended-upgrades auto-reboot (Debian/Ubuntu only)
  lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^Unattended-Upgrade::Automatic-Reboot'
    line: 'Unattended-Upgrade::Automatic-Reboot "false";'
  when: ansible_os_family == "Debian"

- name: Ensure UFW is installed (Debian/Ubuntu only)
  apt:
    name: ufw
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Allow only required ports (kubelet, node-exporter, SSH) — Debian/Ubuntu only
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "10250"
    - "9100"
  when: ansible_os_family == "Debian"

- name: Enable UFW (Debian/Ubuntu only)
  ufw:
    state: enabled
    policy: deny
  when: ansible_os_family == "Debian"

- name: Note firewall approach for RedHat-family (AL2023) hosts
  debug:
    msg: >
      Host firewall skipped on {{ ansible_distribution }} — traffic is restricted
      at the AWS security-group layer instead (see terraform/eks.tf worker
      security group rules).
  when: ansible_os_family != "Debian"

# ---- Containerd ----
- name: Install containerd dependencies (Debian/Ubuntu only)
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install containerd (Debian/Ubuntu only)
  apt:
    name: containerd
    state: present
  when: ansible_os_family == "Debian"

- name: Create containerd config directory (Debian/Ubuntu only)
  file:
    path: /etc/containerd
    state: directory
  when: ansible_os_family == "Debian"

- name: Generate default containerd config (Debian/Ubuntu only)
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml
  when: ansible_os_family == "Debian"

- name: Enable SystemdCgroup for containerd (Debian/Ubuntu only)
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s*SystemdCgroup ='
    line: '            SystemdCgroup = true'
  notify: restart containerd
  when: ansible_os_family == "Debian"

- name: Note containerd approach for RedHat-family (AL2023) hosts
  debug:
    msg: >
      containerd is pre-installed and pre-configured by the AL2023 EKS-optimized
      AMI bootstrap process — skipping manual install/config to avoid overwriting
      AWS's working setup.
  when: ansible_os_family != "Debian"

- name: Ensure containerd is enabled and running
  systemd:
    name: containerd
    enabled: true
    state: started
