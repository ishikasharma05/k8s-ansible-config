---
# ---- OS Hardening ----
- name: Disable swap (required for kubelet)
  command: swapoff -a
  changed_when: false

- name: Remove swap entry from fstab
  lineinfile:
    path: /etc/fstab
    regexp: '^\S+\s+\S+\s+swap\s+'
    state: absent

- name: Load required kernel modules for Kubernetes networking
  modprobe:
    name: "{{ item }}"
    state: present
  loop:
    - overlay
    - br_netfilter

- name: Persist kernel modules across reboot
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Set required sysctl params for Kubernetes
  sysctl:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
    sysctl_set: true
    state: present
    reload: true
  loop:
    - { name: "net.bridge.bridge-nf-call-iptables", value: "1" }
    - { name: "net.bridge.bridge-nf-call-ip6tables", value: "1" }
    - { name: "net.ipv4.ip_forward", value: "1" }

- name: Disable unattended-upgrades auto-reboot (avoid surprise node restarts)
  lineinfile:
    path: /etc/apt/apt.conf.d/50unattended-upgrades
    regexp: '^Unattended-Upgrade::Automatic-Reboot'
    line: 'Unattended-Upgrade::Automatic-Reboot "false";'
  when: ansible_os_family == "Debian"

- name: Ensure UFW is installed
  apt:
    name: ufw
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Allow only required ports (kubelet, node-exporter, SSH)
  ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop:
    - "22"
    - "10250"   # kubelet API
    - "9100"    # node-exporter

- name: Enable UFW
  ufw:
    state: enabled
    policy: deny

# ---- Containerd ----
- name: Install containerd dependencies
  apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg
    state: present
    update_cache: true
  when: ansible_os_family == "Debian"

- name: Install containerd
  apt:
    name: containerd
    state: present
  when: ansible_os_family == "Debian"

- name: Create containerd config directory
  file:
    path: /etc/containerd
    state: directory

- name: Generate default containerd config
  shell: containerd config default > /etc/containerd/config.toml
  args:
    creates: /etc/containerd/config.toml

- name: Enable SystemdCgroup for containerd (required by kubelet)
  lineinfile:
    path: /etc/containerd/config.toml
    regexp: '^\s*SystemdCgroup ='
    line: '            SystemdCgroup = true'
  notify: restart containerd

- name: Ensure containerd is enabled and running
  systemd:
    name: containerd
    enabled: true
    state: started
