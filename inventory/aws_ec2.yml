---
# Dynamic inventory: pulls EC2 instances tagged Role=eks-worker
# Requires: pip install boto3 botocore, and amazon.aws collection installed
plugin: amazon.aws.aws_ec2
regions:
  - ap-south-1   # change to your Terraform region
filters:
  tag:Role: kubernetes-worker
  instance-state-name: running
keyed_groups:
  - key: tags.Environment
    prefix: env
hostnames:
  - instance-id

compose:
  ansible_host: instance_id
  ansible_connection: '"aws_ssm"'
  ansible_aws_ssm_region: '"ap-south-1"'
  ansible_aws_ssm_bucket_name: '"ansible-ssm-662252246018"'
